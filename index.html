<!DOCTYPE html>
<html class="ltr" dir="ltr" lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Track Your Application - Evisa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://evisa.rop.gov.om/Evisa-home-theme/css/jquery-ui-arabic.css">
    <link type="text/css" rel="stylesheet" href="https://evisa.rop.gov.om/Evisa-home-theme/css/jquery-ui.css">
    <script src="https://evisa.rop.gov.om/Evisa-home-theme/js/jquery.js" type="text/javascript"></script>
    <script src="https://evisa.rop.gov.om/Evisa-home-theme/js/jquery-ui.js" type="text/javascript"></script>
    <link class="lfr-css-file" href="https://evisa.rop.gov.om/Evisa-home-theme/css/main.css" rel="stylesheet" type="text/css" />
    <style>
        .header { background: #fff; border-bottom: 1px solid #ddd; padding: 10px 0; }
        .top_header { width: 90%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo_new { background: url('https://evisa.rop.gov.om/Evisa-home-theme/images/custom/ROP_logo.png') no-repeat; width: 220px; height: 60px; background-size: contain; }
        .logo_evisa { background: url('https://evisa.rop.gov.om/Evisa-home-theme/images/custom/e-visa-logo.png') no-repeat; width: 140px; height: 50px; background-size: contain; }

        #search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background-color: #f4f6f9;
            min-height: 60vh;
        }
        .main-search-card {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
        }
        .header-banner {
            background-color: #1a1a1a;
            padding: 25px 15px;
            color: #fff;
            border-bottom: 3px solid #c59b27;
        }
        .header-banner h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-family: Tahoma, sans-serif;
            font-weight: bold;
        }
        .header-banner span {
            font-size: 13px;
            color: #ccc;
            letter-spacing: 0.5px;
        }
        .search-body {
            background-color: #004080;
            padding: 40px 25px;
        }
        .search-body input {
            width: 85%;
            padding: 14px 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        /* زر البحث باللون الأحمر كما طلبت */
        .search-body button {
            background-color: #d9534f;
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-body button:hover {
            background-color: #c9302c;
        }

        #result-container {
            display: none;
            padding: 20px;
        }
        .back-btn {
            display: inline-block;
            margin: 15px;
            color: #004080;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover {
            text-decoration: underline;
        }

        .green-circle-container {
            width: 70px;
            height: 70px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto 10px auto;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
        }
        .green-circle-container svg {
            width: 35px;
            height: 35px;
            fill: #ffffff;
        }
    </style>
</head>
<body class="yui3-skin-sam guest-site signed-out public-page site">
<div id="wrapper">
    <div class="container">
        <header>
            <div class="header">
                <div class="top_header">
                    <div class="one_half"><div class="logo_new"></div></div>
                    <div class="second_half floatRight"><div class="logo_evisa"></div></div>
                </div>
            </div>
        </header>

        <!-- الصفحة الأولى: الاستعلام -->
        <div id="search-container">
            <div class="main-search-card">
                <div class="header-banner">
                    <h2>نظام الاستعلام عن التأشيرات الإلكترونية</h2>
                    <span>E-Visa Verification Gateway</span>
                </div>
                <div class="search-body">
                    <input type="text" id="visaInput" placeholder="أدخل رقم التأشيرة أو رقم الجواز">
                    <br>
                    <button onclick="checkVisa()">بحث</button>
                </div>
            </div>
        </div>

        <!-- الصفحة الثانية: النتائج -->
        <div id="result-container">
            <div id="content">
                <div style="text-align: center;">
                    <a href="#" onclick="goBack()" class="back-btn">&larr; العودة للبحث عن رقم آخر</a>
                </div>
                <div class="newtemplate" id="main-content" role="main">
                    <section class="section-qr">
                        <div class="row">
                            <div class="col-lg-12 text-center">
                                <div class="green-circle-container">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
                                    </svg>
                                </div>
                                <b class="sub_ttl" id="visa-status-text">Visa is Active</b>
                            </div>

                            <br/><hr class="fr fullwidth"/><br clear="all">

                            <div class="qr-content">
                                <p class="mb-0">Visa Number</p>
                                <p class="fw-bold mb-2" id="res-visaNumber">-</p>

                                <p class="mb-0">Given Name</p>
                                <p class="fw-bold mb-2" id="res-givenName">-</p>
                                
                                <p class="mb-0">Family Name</p>
                                <p class="fw-bold mb-2" id="res-familyName">-</p>
                                   
                                <p class="mb-0">Gender</p>
                                <p class="fw-bold mb-2" id="res-gender">-</p>

                                <p class="mb-0">Nationality</p>
                                <p class="fw-bold mb-2" id="res-nationality">-</p>

                                <p class="mb-0">Travel Document Number</p>
                                <p class="fw-bold mb-2" id="res-docNumber">-</p>

                                <p class="mb-0">Travel Document Expiry Date</p>
                                <p class="fw-bold mb-2" id="res-docExpiry">-</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    /* 
      قاعدة البيانات مرتبة ومنظمة بدقة.
      يمكنك بسهولة إضافة أشخاص جدد (حتى 50 وأكثر) عن طريق نسخ أي سطر وتعديل بياناته،
      النظام يبحث تلقائياً سواء أدخل المستخدم (رقم التأشيرة) أو (رقم الجواز).
    */
    const visaDatabase = {
        // الشخص الأول
        "58949899": { visaNumber: "58949899", docNumber: "N01618579", givenName: "AHMAD SAMEER", familyName: "JARWA", gender: "Male", nationality: "SYRIAN ARAB REPUBLIC", docExpiry: "31-07-2030" },
        "N01618579": { visaNumber: "58949899", docNumber: "N01618579", givenName: "AHMAD SAMEER", familyName: "JARWA", gender: "Male", nationality: "SYRIAN ARAB REPUBLIC", docExpiry: "31-07-2030" },

        // الشخص الثاني
        "10000001": { visaNumber: "10000001", docNumber: "A1111111", givenName: "MOHAMMED", familyName: "AL BALUSHI", gender: "Male", nationality: "SULTANATE OF OMAN", docExpiry: "10-01-2030" },
        "A1111111": { visaNumber: "10000001", docNumber: "A1111111", givenName: "MOHAMMED", familyName: "AL BALUSHI", gender: "Male", nationality: "SULTANATE OF OMAN", docExpiry: "10-01-2030" },

        // الشخص الثالث
        "10000002": { visaNumber: "10000002", docNumber: "A2222222", givenName: "FATMA", familyName: "AL HINAI", gender: "Female", nationality: "SULTANATE OF OMAN", docExpiry: "15-02-2030" },
        "A2222222": { visaNumber: "10000002", docNumber: "A2222222", givenName: "FATMA", familyName: "AL HINAI", gender: "Female", nationality: "SULTANATE OF OMAN", docExpiry: "15-02-2030" },

        // الشخص الرابع
        "10000003": { visaNumber: "10000003", docNumber: "B3333333", givenName: "JOHN", familyName: "SMITH", gender: "Male", nationality: "UNITED KINGDOM", docExpiry: "20-03-2030" },
        "B3333333": { visaNumber: "10000003", docNumber: "B3333333", givenName: "JOHN", familyName: "SMITH", gender: "Male", nationality: "UNITED KINGDOM", docExpiry: "20-03-2030" }

        /* 
          يمكنك متابعة إضافة بقية الأشخاص هنا بنفس الترتيب تماماً:
          , "رقم_التأشيرة": { visaNumber: "...", docNumber: "...", givenName: "...", familyName: "...", gender: "...", nationality: "...", docExpiry: "..." }
          , "رقم_الجواز": { visaNumber: "...", docNumber: "...", givenName: "...", familyName: "...", gender: "...", nationality: "...", docExpiry: "..." }
        */
    };

    function checkVisa() {
        let queryVal = document.getElementById('visaInput').value.trim();
        if (!queryVal) {
            alert("الرجاء إدخال رقم التأشيرة أو رقم الجواز");
            return;
        }

        const data = visaDatabase[queryVal];

        if (data) {
            document.getElementById('visa-status-text').innerText = "Visa is Active";
            document.getElementById('res-visaNumber').innerText = data.visaNumber;
            document.getElementById('res-givenName').innerText = data.givenName;
            document.getElementById('res-familyName').innerText = data.familyName;
            document.getElementById('res-gender').innerText = data.gender;
            document.getElementById('res-nationality').innerText = data.nationality;
            document.getElementById('res-docNumber').innerText = data.docNumber;
            document.getElementById('res-docExpiry').innerText = data.docExpiry;
        } else {
            document.getElementById('visa-status-text').innerText = "Invalid Visa Number or Expired";
            document.getElementById('res-visaNumber').innerText = queryVal;
            document.getElementById('res-givenName').innerText = "Not Found";
            document.getElementById('res-familyName').innerText = "-";
            document.getElementById('res-gender').innerText = "-";
            document.getElementById('res-nationality').innerText = "-";
            document.getElementById('res-docNumber').innerText = "-";
            document.getElementById('res-docExpiry').innerText = "-";
        }

        document.getElementById('search-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
    }

    function goBack() {
        document.getElementById('result-container').style.display = 'none';
        document.getElementById('search-container').style.display = 'flex';
        document.getElementById('visaInput').value = '';
    }
</script>
</body>
</html>
