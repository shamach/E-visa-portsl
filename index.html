<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من التأشيرة الإلكترونية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #02553b; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { background-color: #02553b; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #037a56; }
        .error { color: #d9534f; margin-top: 15px; font-weight: bold; }
        .success-box { text-align: right; }
        .success-box p { margin: 8px 0; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .badge { background: #d4edda; color: #155724; padding: 5px 10px; border-radius: 4px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <h2>التحقق من التأشيرة</h2>
    <p style="color: #666; font-size: 14px;">الرجاء إدخال رقم جواز السفر للتحقق من الصلاحية</p>
    <input type="text" id="passportInput" placeholder="أدخل رقم جواز السفر هنا">
    <button onclick="checkVisa()">تحقق من الفيزا</button>
    <div id="errorMessage" class="error"></div>
</div>

<div class="card" id="resultCard" style="display: none;">
    <h2>بيانات التأشيرة الرسمية</h2>
    <div class="success-box" id="visaDetails"></div>
    <button onclick="logout()" style="background-color: #6c757d; margin-top: 20px;">إغلاق</button>
</div>

<script>
    // قاعدة بياناتك الخاصة: أضف أو احذف العملاء هنا بكل سهولة!
    // إذا حذفت العميل من هنا، لن يفتح معه الموقع أبداً ويعطي خطأ.
    const database = [
        {
            passport: "N0152762726",
            name: "MAHER MURJAN",
            country: "الكويت",
            visaNo: "19827625",
            nat: "SYR",
            expiry: "2026-09-25",
            status: "سارية المفعول"
        }
    ];

    function checkVisa() {
        const inputVal = document.getElementById("passportInput").value.trim().toUpperCase();
        const errorDiv = document.getElementById("errorMessage");
        
        if(!inputVal) {
            errorDiv.innerText = "الرجاء إدخال رقم الجواز!";
            return;
        }

        // البحث عن الجواز في القاعدة
        const client = database.find(c => c.passport.toUpperCase() === inputVal);

        if(client) {
            // إذا وجد العميل وكانت الفيزا صالحة
            document.getElementById("loginCard").style.display = "none";
            document.getElementById("resultCard").style.display = "block";
            
            document.getElementById("visaDetails").innerHTML = `
                <p><strong>حالة التأشيرة:</strong> <span class="badge">${client.status}</span></p>
                <p><strong>اسم العميل:</strong> ${client.name}</p>
                <p><strong>رقم التأشيرة:</strong> ${client.visaNo}</p>
                <p><strong>الدولة:</strong> ${client.country}</p>
                <p><strong>رقم الجواز:</strong> ${client.passport}</p>
                <p><strong>الجنسية:</strong> ${client.nat}</p>
                <p><strong>تاريخ الانتهاء:</strong> ${client.expiry}</p>
            `;
        } else {
            // إذا لم يتم العثور على الجواز أو تم حذفه أو انتهى
            errorDiv.innerText = "عذراً، التأشيرة غير موجودة أو منتهية الصلاحية!";
        }
    }

    function logout() {
        document.getElementById("passportInput").value = "";
        document.getElementById("errorMessage").innerText = "";
        document.getElementById("resultCard").style.display = "none";
        document.getElementById("loginCard").style.display = "block";
    }
</script>

</body>
</html>
