<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oman e Visa - Royal Oman Police</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            direction: ltr;
            min-height: 100vh;
            position: relative;
            padding-bottom: 75px; /* مساحة للشريط السفلي وزر القائمة */
            box-sizing: border-box;
        }
        .top-header {
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-container img {
            height: 38px;
            width: auto;
        }
        .blue-banner {
            background-color: #3b5998;
            padding: 6px 20px;
        }
        .lang-switch {
            background-color: #e4e6eb;
            color: #003366;
            border: none;
            padding: 4px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }
        .visa-card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid #dcdcdc;
        }
        h2 {
            color: #003366;
            margin-bottom: 25px;
            font-size: 22px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #b0b0b0;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: left;
            font-size: 15px;
        }
        .action-btn {
            background-color: #3b5998;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .action-btn:hover { background-color: #2d4373; }
        .error-text { color: #d9534f; margin-top: 12px; font-weight: bold; font-size: 13px; }

        .success-icon-circle {
            width: 75px;
            height: 75px;
            background-color: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin: 0 auto 15px auto;
        }
        .active-status-title {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            margin-bottom: 20px;
        }
        .separator-line {
            border: none;
            border-top: 1px solid #e1e8ed;
            margin: 18px 0;
        }
        .data-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
        }
        .data-value {
            font-size: 16px;
            font-weight: bold;
            color: #111;
        }
        
        /* الشريط السفلي المطابق تماماً لصورتك (اللون الأزرق الغامق والزخرفة البيضاء وزر القائمة) */
        .footer-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #3b5998;
            border-top: 1px solid #dcdcdc;
        }
        .footer-pattern {
            height: 22px;
            background-color: #3b5998;
            /* زخرفة متعرجة قريبة جداً للتصميم الأصلي */
            background-image: linear-gradient(135deg, #ffffff 25%, transparent 25%), linear-gradient(225deg, #ffffff 25%, transparent 25%);
            background-size: 12px 12px;
            border-bottom: 2px solid #2d4373;
        }
        .footer-bottom-bar {
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }
        .footer-menu-btn {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

<!-- الهيدر العلوي -->
<div class="top-header">
    <div class="logo-container">
        <img src="https://www.rop.gov.om/arabic/images/logo_ar.png" alt="Royal Oman Police" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Emblem_of_Oman.svg/120px-Emblem_of_Oman.svg.png'">
        <div style="font-size: 10px; font-weight: bold; color: #333; line-height: 1.2; text-align: left;">
            شرطة عمان السلطانية<br>ROYAL OMAN POLICE
        </div>
    </div>
    <div style="font-size: 12px; font-weight: bold; color: #3b5998;">Oman e Visa</div>
</div>

<div class="blue-banner">
    <button class="lang-switch">العربية</button>
</div>

<div class="main-container">
    <!-- شاشة البحث -->
    <div class="visa-card" id="searchScreen">
        <h2>Visa Status Inquiry</h2>
        <input type="text" id="documentInput" placeholder="Enter Travel Document Number">
        <button class="action-btn" onclick="verifyVisa()">Search</button>
        <div id="errorMsg" class="error-text"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div class="visa-card" id="resultScreen" style="display: none;">
        <div class="success-icon-circle">✓</div>
        <div class="active-status-title">Visa is Active</div>
        
        <hr class="separator-line">

        <div class="data-label">Visa Number</div>
        <div class="data-value" id="val_visaNo"></div>

        <div class="data-label" style="margin-top: 15px;">Given Name</div>
        <div class="data-value" id="val_givenName"></div>

        <div class="data-label" style="margin-top: 15px;">Family Name</div>
        <div class="data-value" id="val_familyName"></div>

        <div class="data-label" style="margin-top: 15px;">Gender</div>
        <div class="data-value" id="val_gender"></div>

        <div class="data-label" style="margin-top: 15px;">Nationality</div>
        <div class="data-value" id="val_nat"></div>

        <div class="data-label" style="margin-top: 15px;">Travel Document Number</div>
        <div class="data-value" id="val_documentNo"></div>

        <div class="data-label" style="margin-top: 15px;">Travel Document Expiry Date</div>
        <div class="data-value" id="val_expiry"></div>

        <button class="action-btn" onclick="goBack()" style="background-color: #6c757d; margin-top: 25px;">Back</button>
    </div>
</div>

<!-- الشريط السفلي المطور حسب صورتك بالضبط -->
<div class="footer-container">
    <div class="footer-pattern"></div>
    <div class="footer-bottom-bar">
        <button class="footer-menu-btn">☰</button>
    </div>
</div>

<script>
    // قاعدة البيانات تضم الفيزتين بدقة تامة
    const visaDatabase = [
        {
            passport: "N0152762726",
            visaNo: "58949899",
            givenName: "AHMAD SAMEER",
            familyName: "JARWA",
            gender: "Male",
            nat: "SYRIAN ARAB REPUBLIC",
            expiry: "31-07-2030"
        },
        {
            passport: "N99999O9O",
            visaNo: "98827610",
            givenName: "MAHER",
            familyName: "KHALIL",
            gender: "Male",
            nat: "SYRIAN ARAB REPUBLIC",
            expiry: "25-12-2026"
        }
    ];

    function verifyVisa() {
        const inputVal = document.getElementById("documentInput").value.trim().toUpperCase();
        const errorDiv = document.getElementById("errorMsg");
        
        if(!inputVal) {
            errorDiv.innerText = "Please enter the travel document number!";
            return;
        }

        const foundUser = visaDatabase.find(item => item.passport.toUpperCase() === inputVal);

        if(foundUser) {
            document.getElementById("searchScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            
            document.getElementById("val_visaNo").innerText = foundUser.visaNo;
            document.getElementById("val_givenName").innerText = foundUser.givenName;
            document.getElementById("val_familyName").innerText = foundUser.familyName;
            document.getElementById("val_gender").innerText = foundUser.gender;
            document.getElementById("val_nat").innerText = foundUser.nat;
            document.getElementById("val_documentNo").innerText = foundUser.passport;
            document.getElementById("val_expiry").innerText = foundUser.expiry;
        } else {
            errorDiv.innerText = "Sorry, visa data not found for this document number.";
        }
    }

    function goBack() {
        document.getElementById("documentInput").value = "";
        document.getElementById("errorMsg").innerText = "";
        document.getElementById("resultScreen").style.display = "none";
        document.getElementById("searchScreen").style.display = "block";
    }
</script>

</body>
</html>
