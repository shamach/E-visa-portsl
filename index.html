<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام عن التأشيرة الإلكترونية - سلطنة عمان</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            direction: rtl; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border-top: 5px solid #004a99; 
        }
        .logo-icon {
            font-size: 36px;
            color: #004a99;
            margin-bottom: 5px;
            background: #e6f7ff;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #bae7ff;
        }
        h2 { 
            color: #004a99; 
            margin-top: 10px;
            margin-bottom: 5px; 
            font-size: 22px;
            font-weight: bold;
        }
        p.subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 16px; 
            background-color: #fbfbfb;
        }
        input:focus {
            outline: none;
            border-color: #004a99;
        }
        button.check-btn { 
            background-color: #004a99; 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px;
        }
        button.check-btn:hover { 
            background-color: #003580; 
        }
        .error { 
            color: #d9534f; 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 14px;
        }
        .success-box { 
            text-align: right; 
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #eee;
        }
        .success-box p { 
            margin: 10px 0; 
            font-size: 14px; 
            color: #333;
            border-bottom: 1px dashed #e0e0e0;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .success-box p strong {
            color: #555;
            width: 120px;
            display: inline-block;
        }
        .badge { 
            background: #e6f7ff; 
            color: #004a99; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 13px;
            border: 1px solid #bae7ff;
        }
        button.close-btn {
            background-color: #6c757d; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 4px; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 20px;
        }
        button.close-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>

<!-- شاشة البحث -->
<div class="card" id="loginCard">
    <div class="logo-icon">🇴🇲</div>
    <h2>شرطة عمان السلطانية</h2>
    <p class="subtitle">نظام الاستعلام عن حالة التأشيرة الإلكترونية</p>
    <input type="text" id="passportInput" placeholder="أدخل رقم جواز السفر" aria-label="رقم جواز السفر">
    <button class="check-btn" onclick="checkVisa()">استعلام</button>
    <div id="errorMessage" class="error"></div>
    <p style="font-size: 11px; color: #999; margin-top: 25px;">© الإدارة العامة للجوازات والإقامة</p>
</div>

<!-- شاشة النتيجة -->
<div class="card" id="resultCard" style="display: none;">
    <div class="logo-icon">🇴🇲</div>
    <h2>شرطة عمان السلطانية</h2>
    <p class="subtitle">بيانات التأشيرة الرسمية</p>
    <div class="success-box" id="visaDetails"></div>
    <button class="close-btn" onclick="logout()">رجوع</button>
</div>

<script>
    // قاعدة بيانات العملاء (يمكنك إضافة مئات الأسماء هنا)
    const database = [
        {
            passport: "N0152762726",
            name: "ماهر مرجان",
            visaNo: "١٩٨٢٧٦٢٥",
            country: "الكويت",
            nat: "سوري",
            expiry: "٢٥-٠٩-٢٠٢٦",
            status: "سارية المفعول"
        }
    ];

    function checkVisa() {
        const inputVal = document.getElementById("passportInput").value.trim().toUpperCase();
        const errorDiv = document.getElementById("errorMessage");
        
        if(!inputVal) {
            errorDiv.innerText = "الرجاء إدخال رقم جواز السفر!";
            return;
        }

        const client = database.find(c => c.passport.toUpperCase() === inputVal);

        if(client) {
            document.getElementById("loginCard").style.display = "none";
            document.getElementById("resultCard").style.display = "block";
            
            document.getElementById("visaDetails").innerHTML = `
                <p><strong>حالة التأشيرة:</strong> <span class="badge">${client.status}</span></p>
                <p><strong>اسم العميل:</strong> <span>${client.name}</span></p>
                <p><strong>رقم التأشيرة:</strong> <span>${client.visaNo}</span></p>
                <p><strong>الجنسية:</strong> <span>${client.nat}</span></p>
                <p><strong>رقم الجواز:</strong> <span>${client.passport}</span></p>
                <p><strong>تاريخ الانتهاء:</strong> <span>${client.expiry}</span></p>
            `;
        } else {
            errorDiv.innerText = "عذراً، لم يتم العثور على بيانات للتأشيرة برقم الجواز المدخل.";
        }
    }

    function logout() {
        document.getElementById("passportInput").value = "";
        document.getElementById("errorMessage").innerText = "";
        document.getElementById("resultCard").style.display = "none";
        document.getElementById("loginCard").style.display = "block";
    }
</script>

</body>
</html>
