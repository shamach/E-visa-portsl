            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid #dcdcdc;

        h2 {

            margin-bottom: 25px;

        }

            border: 1px solid #b0b0b0;
            border-radius: 4px;

            text-align: left;
            font-size: 15px;

        .action-btn {

            font-size: 16px;

        .action-btn:hover { background-color: #2d4373; }
        .error-text { color: #d9534f; margin-top: 12px; font-weight: bold; font-size: 13px; }

        .success-icon-circle {

            height: 75px;
            background-color: #2ecc71;
            color: white;
            border-radius: 50%;

        .active-status-title {

            margin-bottom: 20px;
        }
        .separator-line {

            border-top: 1px solid #e1e8ed;
            margin: 18px 0;
        }
        .data-label {

            color: #666;
            margin-bottom: 3px;
        }
        .data-value {
            font-size: 16px;
            font-weight: bold;
            color: #111;
        }
        
        /* تذييل الصفحة الكامل والآمن */
        .footer-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #4a63cb; 
        }
        
        /* شريط الزخرفة المدمج مشفراً لضمان التكرار الفوري */
        .footer-pattern-bar {
            width: 100%;
            height: 42px;
            /* كود مشفر مدمج يحتوي على تفاصيل الزخرفة الثنائية الهندسية البيضاء */

            background-repeat: repeat-x;
            background-size: auto 100%;
            background-position: left center;
        }

        .footer-bottom-bar {
            background-color: #4a63cb;
            padding: 12px 15px;
            display: flex;
            align-items: center;
        }
        .footer-menu-btn {
            background-color: transparent;
            color: white;
            border: 1px solid #ffffff;
            padding: 4px 10px;
            border-radius: 4px;

<body>
<!-- ترويسة الشعار المرسومة ذاتياً برمجياً داخل الكود لضمان تخطي الحجب بنسبة 100% -->
<div class="top-header-img">
    <svg class="header-logo-svg" viewBox="0 0 850 100" fill="none" xmlns="http://w3.org">
        <!-- أيقونة مستوحاة من هيكل درع شعار الشرطة -->
        <g transform="translate(10, 10)">
            <path d="M40 10 L70 25 L70 55 C70 75 40 85 40 85 C40 85 10 75 10 55 L10 25 Z" fill="#4a63cb" stroke="#003366" stroke-width="2"/>
            <path d="M40 20 L58 30 L58 52 C58 65 40 73 40 73 C40 73 22 65 22 52 L22 30 Z" fill="#ffffff"/>
            <circle cx="40" cy="45" r="10" fill="#cc0000"/>
            <path d="M35 45 L40 35 L45 45 L35 45 Z" fill="#ffffff"/>
        </g>
        
        <!-- نصوص الهوية الرسمية باللغتين العربية والإنجليزية -->
        <text x="100" y="42" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="24" font-weight="bold" letter-spacing="0.5">شُرْطَة عُمَان السُّلْطَانِيَّة</text>
        <text x="100" y="75" fill="#555555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="1">ROYAL OMAN POLICE</text>
        
        <!-- ترويسة قسم التأشيرات الجانبي المتناسق -->
        <text x="440" y="42" fill="#512da8" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Oman eVisa</text>
        <text x="440" y="70" fill="#777777" font-family="Arial, sans-serif" font-size="13">التأشيرة الإلكترونية العُمانية</text>
        
        <!-- زر القائمة الجانبي المتطابق مع صورتك -->
        <g transform="translate(750, 25)">
            <rect width="45" height="42" rx="6" fill="#4a63cb"/>
            <line x1="10" y1="14" x2="35" y2="14" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="10" y1="21" x2="35" y2="21" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="10" y1="28" x2="35" y2="28" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </g>
    </svg>
</div>

<div class="main-container">
    <!-- شاشة البحث -->
    <div class="visa-card" id="searchScreen">
        <h2>Visa Status Inquiry</h2>
        <input type="text" id="documentInput" placeholder="Enter Travel Document Number">
        <button class="action-btn" onclick="verifyVisa()">Search</button>
        <div id="errorMsg" class="error-text"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div class="visa-card" id="resultScreen" style="display: none;">
        <div class="success-icon-circle">✓</div>
        <div class="active-status-title">Visa is Active</div>
        
        <hr class="separator-line">

        <div class="data-label">Visa Number</div>
        <div class="data-value" id="val_visaNo"></div>

        <div class="data-label" style="margin-top: 15px;">Given Name</div>
        <div class="data-value" id="val_givenName"></div>

        <div class="data-label" style="margin-top: 15px;">Family Name</div>
        <div class="data-value" id="val_familyName"></div>

        <div class="data-label" style="margin-top: 15px;">Gender</div>
        <div class="data-value" id="val_gender"></div>

        <div class="data-label" style="margin-top: 15px;">Nationality</div>
        <div class="data-value" id="val_nat"></div>

        <div class="data-label" style="margin-top: 15px;">Travel Document Number</div>
        <div class="data-value" id="val_documentNo"></div>

        <div class="data-label" style="margin-top: 15px;">Travel Document Expiry Date</div>
        <div class="data-value" id="val_expiry"></div>
    </div>
</div>
<!-- الشريط السفلي الثابت للزخرفة -->
<div class="footer-container">
    <div class="footer-pattern-bar"></div>
    <div class="footer-bottom-bar">
        <button class="footer-menu-btn" onclick="goBack()">☰</button>
    </div>
</div>

<script>
    const visaDatabase = [
        {
            passport: "N0152762726",
            visaNo: "58949899",
            givenName: "AHMAD SAMEER",
            familyName: "JARWA",
            gender: "Male",
            nat: "SYRIAN ARAB REPUBLIC",
            expiry: "31-07-2030"
        },
        {
            passport: "N99999O9O",
            visaNo: "98827610",

givenName: "MAHER",
familyName: "KHALIL",
gender: "Male",
nat: "SYRIAN ARAB REPUBLIC",
expiry: "25-12-2026"
}
];
function verifyVisa() {
const inputVal = document.getElementById("documentInput").value.trim().toUpperCase();
const errorDiv = document.getElementById("errorMsg");
if(!inputVal) {
errorDiv.innerText = "Please enter the travel document number!";
return;
}
const foundUser = visaDatabase.find(item => item.passport.toUpperCase() === inputVal);
if(foundUser) {
document.getElementById("searchScreen").style.display = "none";
document.getElementById("resultScreen").style.display = "block";
document.getElementById("val_visaNo").innerText = foundUser.visaNo;
document.getElementById("val_givenName").innerText = foundUser.givenName;
document.getElementById("val_familyName").innerText = foundUser.familyName;
document.getElementById("val_gender").innerText = foundUser.gender;
document.getElementById("val_nat").innerText = foundUser.nat;
document.getElementById("val_documentNo").innerText = foundUser.passport;
document.getElementById("val_expiry").innerText = foundUser.expiry;
} else {
errorDiv.innerText = "Sorry, visa data not found for this document number.";
}
}
function goBack() {
document.getElementById("documentInput").value = "";
document.getElementById("errorMsg").innerText = "";
document.getElementById("resultScreen").style.display = "none";
document.getElementById("searchScreen").style.display = "block";
}
