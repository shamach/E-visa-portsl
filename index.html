<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Your Application - Evisa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        
        /* الهيدر العلوي */
        .header { background: #fff; border-bottom: 1px solid #ddd; padding: 15px 0; }
        .top_header { width: 90%; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo_new { background: url('https://evisa.rop.gov.om/Evisa-home-theme/images/custom/ROP_logo.png') no-repeat center/contain; width: 200px; height: 50px; }
        .logo_evisa { background: url('https://evisa.rop.gov.om/Evisa-home-theme/images/custom/e-visa-logo.png') no-repeat center/contain; width: 120px; height: 40px; }

        /* واجهة البحث */
        #search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            min-height: 70vh;
        }
        .main-search-card {
            background: #fff;
            width: 100%;
            max-width: 550px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }
        .header-banner {
            background-color: #1a1a1a;
            padding: 25px 15px;
            color: #fff;
            border-bottom: 3px solid #c59b27;
        }
        .header-banner h2 { font-size: 20px; margin-bottom: 5px; }
        .header-banner span { font-size: 13px; color: #aaa; }
        
        .search-body {
            background-color: #004080;
            padding: 40px 30px;
        }
        .search-body input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        /* زر البحث باللون الأحمر كما طلبت */
        .search-body button {
            background-color: #d9534f;
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-body button:hover { background-color: #c9302c; }

        /* واجهة النتائج */
        #result-container {
            display: none;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #004080;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover { text-decoration: underline; }

        .result-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .green-circle-container {
            width: 70px;
            height: 70px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
        }
        .green-circle-container svg { width: 35px; height: 35px; fill: #ffffff; }
        .sub_ttl { font-size: 20px; color: #28a745; display: block; text-align: center; margin-bottom: 20px; }
        
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        
        .qr-content p { font-size: 14px; color: #666; margin-bottom: 4px; }
        .qr-content p.fw-bold { font-size: 16px; color: #222; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>

        <div class="search-body">

            <button onclick="checkVisa()">بحث</button>

    </div>
</div>

    function checkVisa() {
        let queryVal = document.getElementById('visaInput').value.trim();
        if (!queryVal) {
            alert("الرجاء إدخال رقم التأشيرة أو رقم الجواز");
            return;
        }

        const data = visaDatabase[queryVal];

        if (data) {
            document.getElementById('visa-status-text').innerText = "Visa is Active";
            document.getElementById('res-visaNumber').innerText = data.visaNumber;
            document.getElementById('res-givenName').innerText = data.givenName;
            document.getElementById('res-familyName').innerText = data.familyName;
            document.getElementById('res-gender').innerText = data.gender;
            document.getElementById('res-nationality').innerText = data.nationality;
            document.getElementById('res-docNumber').innerText = data.docNumber;
            document.getElementById('res-docExpiry').innerText = data.docExpiry;
        } else {
            document.getElementById('visa-status-text').innerText = "Invalid Visa Number or Expired";
            document.getElementById('res-visaNumber').innerText = queryVal;
            document.getElementById('res-givenName').innerText = "Not Found";
            document.getElementById('res-familyName').innerText = "-";
            document.getElementById('res-gender').innerText = "-";
            document.getElementById('res-nationality').innerText = "-";
            document.getElementById('res-docNumber').innerText = "-";
            document.getElementById('res-docExpiry').innerText = "-";
        }

        document.getElementById('result-container').style.display = 'block';
    }

    function goBack() {
        document.getElementById('result-container').style.display = 'none';
        document.getElementById('search-container').style.display = 'flex';
